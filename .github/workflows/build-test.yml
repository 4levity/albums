name: Build / Test
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
        description: Codecov upload token
jobs:
  static:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # CI syncs only the dependency groups each job needs (the Makefile's
      # GROUPS), so a job never downloads, e.g., the docs-only zensical. test
      # is included too: pyright resolves imports from the venv (tests import
      # pytest; scripts/version.py imports setuptools_scm, in the test group)
      - name: Install dependencies
        run: make install GROUPS="lint test"
      - name: Static checks
        run: make static GROUPS="lint test"

  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # floor and ceiling of the supported Python range
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: make install GROUPS=test
      - name: Run tests
        if: matrix.python == '3.12'
        env:
          TERM: "dumb"
        run: make test GROUPS=test
      - name: Run tests with coverage
        if: matrix.python == '3.14'
        env:
          TERM: "dumb"
        run: make coverage GROUPS=test
      - name: Upload coverage to Codecov
        if: (success() || failure()) && matrix.python == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: coverage
      - name: Upload test results to Codecov
        if: (success() || failure()) && matrix.python == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: build/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
      - name: Add coverage link to job summary
        if: (success() || failure()) && matrix.python == '3.14'
        run: |
          echo "Test results and coverage report: https://app.codecov.io/gh/4levity/albums" >> "$GITHUB_STEP_SUMMARY"

  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      # no `make install`: uv build uses an isolated build environment
      - name: Create package
        run: make package
      - name: Upload wheel artifact
        id: artifact-wheel
        uses: actions/upload-artifact@v7
        with:
          name: albums-wheel
          path: dist/*.whl
          archive: false
      - name: Upload source artifact
        id: artifact-source
        uses: actions/upload-artifact@v7
        with:
          name: albums-source
          path: dist/*.tar.gz
          archive: false
      - name: Artifact links
        run: |
          echo "🚀 Python - [wheel](${{ steps.artifact-wheel.outputs.artifact-url }}) / [source](${{ steps.artifact-source.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  # Wine jobs: run in parallel on self-hosted runners (label wine) in the
  # purpose-built image (docker/): wine 11, xvfb and a warm wine environment
  # are already installed, so the jobs skip the multi-minute wine apt install
  # that ubuntu-latest needs. See docker/self_hosted_runner.md.
  wine-pytest:
    runs-on: [self-hosted, wine]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check wine version
        run: wine --version
      # the host venv only runs the (stdlib-only) wine scripts: no groups
      - name: Install dependencies
        run: make install GROUPS=none
      - name: Use baked-in wine environment
        # The runner image ships a warm wine environment (prefix, uv,
        # Windows Python, Inno Setup) at /opt/wine/env. The script links it
        # into the checkout while its fingerprint matches the wine scripts
        # and no other job is using it (wineserver lock); wine-setup then
        # builds a fresh one. The environment persists in the runner
        # container between jobs, and the jobs' group-restricted `uv
        # sync`/`uv run` calls top up any lockfile changes. A failed guard
        # warns (annotation, not failure) and names the likely fix.
        run: sh docker/wine_link_env.sh
      - name: Run test suite under wine
        run: make wine-pytest GROUPS=none

  wine-build:
    runs-on: [self-hosted, wine]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check wine version
        run: wine --version
      # the host venv runs the version/icon steps (setuptools-scm, project
      # deps); the wine venv syncs its own pyinstaller group
      - name: Install dependencies
        run: make install GROUPS=pyinstaller
      - name: Use baked-in wine environment
        # The runner image ships a warm wine environment (prefix, uv,
        # Windows Python, Inno Setup) at /opt/wine/env. The script links it
        # into the checkout while its fingerprint matches the wine scripts
        # and no other job is using it (wineserver lock); wine-setup then
        # builds a fresh one. The environment persists in the runner
        # container between jobs, and the jobs' group-restricted `uv
        # sync`/`uv run` calls top up any lockfile changes. A failed guard
        # warns (annotation, not failure) and names the likely fix.
        run: sh docker/wine_link_env.sh
      - name: Build Windows installer
        run: make wine-build GROUPS=pyinstaller
      - name: Test installer end-to-end
        run: make wine-e2e GROUPS=pyinstaller
      - name: Upload installer artifact
        id: artifact-windows-installer
        uses: actions/upload-artifact@v7
        with:
          name: albums-windows-installer
          path: dist/installer/*.exe
          archive: false
      - name: Artifact link
        run: |
          echo "🚀 Windows installer - [download artifact](${{ steps.artifact-windows-installer.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
