name: Build / Test
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
        description: Codecov upload token
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # CI syncs only the dependency groups each job needs (the Makefile's
      # GROUPS), so a job never downloads, e.g., the docs-only zensical
      - name: Install dependencies
        run: make install GROUPS=lint
      - name: Static checks
        run: make static GROUPS=lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor and ceiling of the supported Python range
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: make install GROUPS=test
      - name: Run tests
        if: matrix.python == '3.12'
        env:
          TERM: "dumb"
        run: make test GROUPS=test
      - name: Run tests with coverage
        if: matrix.python == '3.14'
        env:
          TERM: "dumb"
        run: make coverage GROUPS=test
      - name: Upload to Codecov
        if: matrix.python == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Add coverage link to job summary
        if: matrix.python == '3.14'
        run: 'echo "Coverage report: https://app.codecov.io/gh/4levity/albums" >> "$GITHUB_STEP_SUMMARY"'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      # no `make install`: uv build uses an isolated build environment
      - name: Create package
        run: make package
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-package
          path: dist/

  # Wine jobs: run in parallel on self-hosted runners (label wine) in the
  # purpose-built image (docker/): wine 11, xvfb and a warm wine environment
  # are already installed, so the jobs skip the multi-minute wine apt install
  # that ubuntu-latest needs. See docker/self_hosted_runner.md.
  wine-pytest:
    runs-on: [self-hosted, wine]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check wine version
        run: wine --version
      # the host venv only runs the (stdlib-only) wine scripts: no groups
      - name: Install dependencies
        run: make install GROUPS=none
      - name: Use baked-in wine environment
        # The runner image ships a warm wine environment (prefix, uv,
        # Windows Python, Inno Setup) at /opt/wine/env. Link it into the
        # checkout while its fingerprint matches the wine scripts and no
        # other job is using it (wineserver lock); wine-setup then builds a
        # fresh one. The environment persists in the runner container
        # between jobs, and the jobs' group-restricted `uv sync`/`uv run`
        # calls top up any lockfile changes.
        run: |
          if [ ! -e .cache/wine ] && [ -d /opt/wine/env ] && [ ! -e /opt/wine/env/prefix/.lock ] && sha256sum -c /opt/wine/env/fingerprint --quiet; then
            mkdir -p .cache
            ln -s /opt/wine/env .cache/wine
            echo "using baked-in wine environment"
          else
            echo "building a fresh wine environment"
          fi
      - name: Run test suite under wine
        run: make wine-pytest GROUPS=none

  wine-build:
    runs-on: [self-hosted, wine]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check wine version
        run: wine --version
      # the host venv runs the version/icon steps (setuptools-scm, project
      # deps); the wine venv syncs its own pyinstaller group
      - name: Install dependencies
        run: make install GROUPS=pyinstaller
      - name: Use baked-in wine environment
        # The runner image ships a warm wine environment (prefix, uv,
        # Windows Python, Inno Setup) at /opt/wine/env. Link it into the
        # checkout while its fingerprint matches the wine scripts and no
        # other job is using it (wineserver lock); wine-setup then builds a
        # fresh one. The environment persists in the runner container
        # between jobs, and the jobs' group-restricted `uv sync`/`uv run`
        # calls top up any lockfile changes.
        run: |
          if [ ! -e .cache/wine ] && [ -d /opt/wine/env ] && [ ! -e /opt/wine/env/prefix/.lock ] && sha256sum -c /opt/wine/env/fingerprint --quiet; then
            mkdir -p .cache
            ln -s /opt/wine/env .cache/wine
            echo "using baked-in wine environment"
          else
            echo "building a fresh wine environment"
          fi
      - name: Build Windows installer
        run: make wine-build GROUPS=pyinstaller
      - name: Test installer end-to-end
        run: make wine-e2e GROUPS=pyinstaller
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-installer-win
          path: dist/installer/*.exe
