name: Build / Test
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
        description: Codecov upload token
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: make install
      - name: Static checks
        run: make static

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor and ceiling of the supported Python range
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: make install
      - name: Run tests
        if: matrix.python == '3.12'
        env:
          TERM: "dumb"
        run: make test
      - name: Run tests with coverage
        if: matrix.python == '3.14'
        env:
          TERM: "dumb"
        run: make coverage
      - name: Upload to Codecov
        if: matrix.python == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Add coverage link to job summary
        if: matrix.python == '3.14'
        run: 'echo "Coverage report: https://app.codecov.io/gh/4levity/albums" >> "$GITHUB_STEP_SUMMARY"'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Create package
        run: make package
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-package
          path: dist/

  wine:
    # self-hosted runner in the purpose-built image (docker/): wine 11,
    # xvfb and a warm wine environment are already installed, so the job
    # skips the multi-minute wine apt install that ubuntu-latest needs
    runs-on: [self-hosted, wine]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Check wine version
        run: wine --version
      - name: Install dependencies
        run: make install
      - name: Use baked-in wine environment
        # The runner image ships a warm wine environment (prefix, uv,
        # Windows Python, Inno Setup) at /opt/wine/env. Link it into the
        # checkout while its fingerprint matches the wine scripts and no
        # other job is using it (wineserver lock); wine-setup then builds a
        # fresh one. The environment persists in the runner container
        # between jobs, and wine-build's `uv sync --locked` tops up any
        # lockfile changes.
        run: |
          if [ ! -e .cache/wine ] && [ -d /opt/wine/env ] && [ ! -e /opt/wine/env/prefix/.lock ] && sha256sum -c /opt/wine/env/fingerprint --quiet; then
            mkdir -p .cache
            ln -s /opt/wine/env .cache/wine
            echo "using baked-in wine environment"
          else
            echo "building a fresh wine environment"
          fi
      - name: Run test suite under wine
        run: make wine-pytest
      - name: Build Windows installer
        run: make wine-build
      - name: Test installer end-to-end
        run: make wine-e2e
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-installer-win
          path: dist/installer/*.exe
