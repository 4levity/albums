name: Release
on:
  push:
    tags:
      - "v*"
      # Exclude tags auto-created by dispatch runs (post-release versions
      # like v0.9.30.post24+g1234abcd) so they do not retrigger this workflow.
      - "!v*post*"
  workflow_dispatch:
jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  build-linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      # the pyinstaller group (with setuptools-scm for scripts/version.py)
      - name: Install dependencies
        run: make install GROUPS=pyinstaller
      - name: Build executable
        run: make pyinstaller GROUPS=pyinstaller && ls -l dist/pyinstaller
      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-pyinstaller-linux
          path: dist/pyinstaller/linux_x86_64/albums/
  publish:
    needs: [build-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      id-token: write # Use OIDC permissions for trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: albums-package
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
  release:
    needs: [build-test, build-linux]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        # already built, but the release is created from this checkout
        with:
          fetch-depth: 0
      - name: Download Linux executable
        uses: actions/download-artifact@v8
        with:
          name: albums-pyinstaller-linux
          path: albums_linux_x86_64/
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: albums-installer-win
          path: albums_win_x86_64/
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: albums-package
          path: dist/
      - name: Get version
        id: get-version
        run: |
          chmod a+x albums_linux_x86_64/albums
          echo "ALBUMS_VERSION=$(albums_linux_x86_64/albums --version | awk -F ' ' '{ print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Create archive
        run: zip -r albums_linux_x86_64.zip albums_linux_x86_64
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALBUMS_VERSION: ${{ steps.get-version.outputs.ALBUMS_VERSION }}
          # Point the auto-created tag at the triggering commit (tip of the
          # selected branch on dispatch); ignored when the tag already exists.
          TARGET: ${{ github.sha }}
          # Draft for manual dispatch runs, published for tag pushes.
          IS_DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--title "Release v${ALBUMS_VERSION}" --target "${TARGET}")
          if [ "$IS_DRAFT" = "true" ]; then args+=(--draft); fi
          gh release create "v${ALBUMS_VERSION}" "${args[@]}"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALBUMS_VERSION: ${{ steps.get-version.outputs.ALBUMS_VERSION }}
        run: gh release upload "v${ALBUMS_VERSION}" albums_win_x86_64/*.exe albums_linux_x86_64.zip dist/*.tar.gz --clobber
