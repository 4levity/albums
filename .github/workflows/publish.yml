name: Publish Package
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: make install
      - name: Lint/analyze source
        run: make lint
      - name: Spell check
        run: make spelling
      - name: Run tests
        env:
          TERM: "dumb"
        run: make test
      - name: Create package
        run: make package
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-package
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Use OIDC permissions for trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: albums-package
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
