name: Publish Package
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor and ceiling of the supported Python range
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: make install
      - name: Static checks
        run: make static
      - name: Run tests
        env:
          TERM: "dumb"
        run: make test
      - name: Create package
        # package once, on the ceiling version; the build is version independent
        if: matrix.python == '3.14'
        run: make package
      - name: Upload package artifact
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: albums-package
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Use OIDC permissions for trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: albums-package
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
