name: Make Pyinstaller Executables
on:
  push:
    tags:
      - "v*"
      # Exclude tags auto-created by dispatch runs (post-release versions
      # like v0.9.30.post24+g1234abcd) so they do not retrigger this workflow.
      - "!v*post*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: make install
      - name: Build executable
        run: make pyinstaller && ls -l dist && ls -l dist/pyinstaller
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-pyinstaller-linux
          path: dist/pyinstaller/linux_x86_64/albums/

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      # the windows runner image has no make, so run the make pyinstaller steps directly
      - name: Install dependencies
        run: uv sync --locked
        shell: bash
      - name: Build executable
        run: |
          uv run python scripts/version.py write
          platform=$(uv run python -c "import sysconfig; print(sysconfig.get_platform().replace('-', '_'))")
          uv run pyinstaller src/albums/__main__.py --onedir --name albums --noconfirm --clean \
            --collect-data albums \
            --workpath build/$platform --distpath dist/pyinstaller/$platform \
            --specpath build/$platform/.specs --contents-directory _albums_internal
          ls -l dist/pyinstaller/$platform/albums
        shell: bash
      - name: Build installer
        run: |
          iscc /DAppVersion="$(uv run --quiet python scripts/version.py fileversion | tr -d '\r')" \
            /DFileVersion="$(uv run --quiet python scripts/version.py fileversion | tr -d '\r')" scripts/albums.iss
          ls -l dist/installer
        shell: bash
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-installer-win
          path: dist/installer/*.exe

  release:
    needs: [build-linux, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        # already built but need checkout to create release
        with:
          fetch-depth: 0
      - name: Prepare folders
        run: |
          mkdir albums_win_x86_64
          mkdir albums_linux_x86_64
      - name: Download Linux executable
        uses: actions/download-artifact@v8
        with:
          name: albums-pyinstaller-linux
          path: albums_linux_x86_64/
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: albums-installer-win
          path: albums_win_x86_64/
      - name: Get version
        id: get-version
        run: |
          chmod a+x albums_linux_x86_64/albums
          echo "ALBUMS_VERSION=$(albums_linux_x86_64/albums --version | awk -F ' ' '{ print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Create archive
        run: zip -r albums_linux_x86_64.zip albums_linux_x86_64
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALBUMS_VERSION: ${{ steps.get-version.outputs.ALBUMS_VERSION }}
          # Point the auto-created tag at the triggering commit (tip of the
          # selected branch on dispatch); ignored when the tag already exists.
          TARGET: ${{ github.sha }}
          # Draft for manual dispatch runs, published for tag pushes.
          IS_DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--title "Release v${ALBUMS_VERSION}" --target "${TARGET}")
          if [ "$IS_DRAFT" = "true" ]; then args+=(--draft); fi
          gh release create "v${ALBUMS_VERSION}" "${args[@]}"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALBUMS_VERSION: ${{ steps.get-version.outputs.ALBUMS_VERSION }}
        run: gh release upload "v${ALBUMS_VERSION}" albums_win_x86_64/*.exe albums_linux_x86_64.zip --clobber
