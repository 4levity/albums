name: Make Pyinstaller Executables
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: make install
      - name: Build executable
        run: make pyinstaller && ls -l dist && ls -l dist/pyinstaller
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-pyinstaller-linux
          path: dist/pyinstaller/linux_x86_64/albums/

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      # the windows runner image has no make, so run the make pyinstaller steps directly
      - name: Install dependencies
        run: uv sync --locked
        shell: bash
      - name: Build executable
        run: |
          uv run python scripts/version.py write
          platform=$(uv run python -c "import sysconfig; print(sysconfig.get_platform().replace('-', '_'))")
          uv run pyinstaller src/albums/__main__.py --onedir --name albums --noconfirm --clean \
            --collect-data albums \
            --workpath build/$platform --distpath dist/pyinstaller/$platform \
            --specpath build/$platform/.specs --contents-directory _albums_internal
          ls -l dist/pyinstaller/$platform/albums
        shell: bash
      - name: Upload pyinstaller artifact
        uses: actions/upload-artifact@v7
        with:
          name: albums-pyinstaller-win
          path: dist/pyinstaller/win_amd64/albums/

  release:
    needs: [build-linux, build-win]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Prepare folders
        run: |
          mkdir albums_win_x86_64
          mkdir albums_linux_x86_64
      - name: Download Linux executable
        uses: actions/download-artifact@v8
        with:
          name: albums-pyinstaller-linux
          path: albums_linux_x86_64/
      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: albums-pyinstaller-win
          path: albums_win_x86_64/
      - name: Get version
        id: get-version
        run: |
          chmod a+x albums_linux_x86_64/albums
          echo "ALBUMS_VERSION=$(albums_linux_x86_64/albums --version | awk -F ' ' '{ print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Create archives
        run: |
          zip -r albums_win_x86_64.zip albums_win_x86_64
          zip -r albums_linux_x86_64.zip albums_linux_x86_64
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-version.outputs.ALBUMS_VERSION }}
          release_name: Release v${{ steps.get-version.outputs.ALBUMS_VERSION }}
          draft: ${{ github.ref == 'refs/heads/main' }}
          prerelease: false
      - name: Upload albums_win_x86_64.zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./albums_win_x86_64.zip
          asset_name: albums_win_x86_64.zip
          asset_content_type: application/zip
      - name: Upload albums_linux_x86_64.zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./albums_linux_x86_64.zip
          asset_name: albums_linux_x86_64.zip
          asset_content_type: application/zip
