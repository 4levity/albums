name: Build/Test
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: make install
      - name: Lint/analyze source
        run: make lint
      - name: Spell check
        uses: streetsidesoftware/cspell-action@v8
        with:
          files: |
            *
            **/*
            .github
          incremental_files_only: false
      - name: Run tests
        env:
          TERM: "dumb"
        run: make test
