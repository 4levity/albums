# Markdown lint + format (rumdl). Docs: https://rumdl.dev

[global]
# wrap prose at 80 columns
line-length = 80
# MD057 checks that relative links resolve relative to the markdown file,
# but the docs link to repo paths (e.g. src/albums/...) relative to the
# project root, so it would flag them
disable = ["MD057"]

# 4-space list indent
[MD007]
indent = 4

# reflow prose to line-length when fixing; code blocks (e.g. workflow
# excerpts) are exempt
[MD013]
reflow = true
code-blocks = false

# MD046 (code block style): the parser misclassifies 4-space-indented
# admonition (!!!) content as an indented code block when the document also
# has fenced code blocks, so the rule is disabled
[MD046]
enabled = false

# keep table columns consistently aligned
[MD060]
enabled = true
